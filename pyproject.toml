[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rumor-mill-ai"
version = "0.1.0"
description = "A living AI web-toon where characters keep secrets and spread rumors."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.1,<1",
  "pydantic-settings>=2.10.1,<3",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<1",
  "mypy>=1.17.1,<2",
  "pre-commit>=4.2.0,<5",
  "pytest>=8.4.1,<9",
  "pytest-cov>=6.2.1,<7",
  "ruff>=0.12.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rumor_mill"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=rumor_mill --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
