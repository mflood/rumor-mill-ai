services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rumor_mill
      POSTGRES_USER: rumor_mill
      POSTGRES_PASSWORD: rumor_mill
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rumor_mill -d rumor_mill"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
